services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: finnish_energy
      POSTGRES_USER: energy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U energy -d finnish_energy"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
