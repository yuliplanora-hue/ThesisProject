name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      failure_probe:
        description: 'Deliberately fail a separate job using a corrupted temporary synthetic fixture'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    name: Offline tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.7'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-lock.txt
      - name: Install declared dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Run offline synthetic tests
        run: python -m unittest discover -s tests -v
      - name: Check project CLI entry point
        run: python -m ingestion --help
      - name: Check bounded scheduler entry point
        run: python -m ingestion schedule --help

  database-foundation:
    name: PostgreSQL foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: finnish_energy
          POSTGRES_USER: energy
          # Public fixture credential for this disposable CI service only.
          POSTGRES_PASSWORD: energy_ci_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U energy -d finnish_energy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      POSTGRES_PASSWORD: energy_ci_test_only
      ENERGY_DB_HOST: 127.0.0.1
      ENERGY_DB_PORT: '5432'
      ENERGY_DB_NAME: finnish_energy
      ENERGY_DB_USER: energy
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.7'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-lock.txt
      - name: Install declared dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Check migrations and operational ledger
        run: python -m ingestion database check

  controlled-failure:
    name: Controlled failure demonstration (opt-in)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.failure_probe }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.7'
      - name: Demonstrate a visible failing check
        run: python tools/ci_failure_probe.py
